<rect x="266" y="0" width="130" height="30" rx="8" fill="#2b2d30" stroke="#43454a"/><text x="331" y="20" text-anchor="middle" fill="#bcbec4">Windows 10 / 11</text>
</g>
<g transform="translate(720,60)">
<rect x="0" y="0" width="220" height="140" rx="10" fill="#2b2d30" stroke="#43454a"/>
<rect x="0" y="0" width="220" height="26" rx="10" fill="#313438"/><rect x="0" y="14" width="220" height="12" fill="#313438"/>
