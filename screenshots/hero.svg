<rect x="14" y="82" width="90" height="34" rx="6" fill="#1e1f22" stroke="#3574f0aa"/><text x="59" y="103" text-anchor="middle" fill="#3574f0" font-weight="700">T:  Marketing</text>
<rect x="116" y="82" width="90" height="34" rx="6" fill="#1e1f22" stroke="#5fb86555"/><text x="161" y="103" text-anchor="middle" fill="#5fb865" font-weight="700">+ add</text>
