<svg viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Segoe UI, Roboto, sans-serif" role="img">
<title>OneDriveAsADrive banner</title>
<desc>OneDriveAsADrive — mount OneDrive and SharePoint as Windows drive letters.</desc>
<rect width="1000" height="260" rx="16" fill="#1e1f22"/>
<rect x="0" y="0" width="6" height="260" fill="url(#jb)"/>
<text x="60" y="96" fill="#dfe1e5" font-size="44" font-weight="800">OneDriveAsADrive</text>
<text x="62" y="134" font-size="19" font-weight="600" fill="url(#jb)">Mount OneDrive &amp; SharePoint as real Windows drive letters</text>
<text x="62" y="164" fill="#868a91" font-size="14">No sync client · no app registration · modern OAuth2/MFA · IT-deployable</text>
<g transform="translate(60,190)" font-size="13" font-weight="600">
<rect x="0" y="0" width="150" height="30" rx="8" fill="#2b2d30" stroke="#43454a"/><text x="75" y="20" text-anchor="middle" fill="#bcbec4">winget · npm · exe</text>
