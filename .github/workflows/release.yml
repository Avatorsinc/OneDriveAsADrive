name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish single-file exe
        run: dotnet publish -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o publish/

      - name: Create release zip
        run: Compress-Archive -Path publish/OneDriveAsADrive.exe, install.ps1 -DestinationPath OneDriveAsADrive-${{ github.ref_name }}-win-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: OneDriveAsADrive ${{ github.ref_name }}
          body: |
            ## Install

            **One-liner (PowerShell as Administrator):**

            ```
            iwr https://github.com/${{ github.repository }}/releases/latest/download/install.ps1 -UseBasicParsing | iex
            ```

            Or download the zip, extract, and run `OneDriveAsADrive.exe`.

            **Requirements:** Windows 10/11, OneDrive sync client signed in with a work/school Microsoft 365 account.
          files: |
            OneDriveAsADrive-${{ github.ref_name }}-win-x64.zip
            install.ps1
          draft: false
          prerelease: false
