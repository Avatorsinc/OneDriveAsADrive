name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish single-file exe
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          dotnet publish -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:Version=$version -o publish/

      - name: Create release zip
        run: Compress-Archive -Path publish/OneDriveAsADrive.exe, install.ps1, config.example.json -DestinationPath OneDriveAsADrive-${{ github.ref_name }}-win-x64.zip

      # The proper double-click / winget installer. Inno Setup ships preinstalled on the
      # windows-latest runner image; choco covers us if it ever goes missing.
      - name: Build Setup.exe (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = "${{ github.ref_name }}".TrimStart("v")
          & $iscc /DAppVersion=$version installer\OneDriveAsADrive.iss
          Move-Item installer\Output\OneDriveAsADrive-Setup.exe OneDriveAsADrive-Setup-${{ github.ref_name }}.exe

      - name: Compute SHA256
        run: |
          $zip = "OneDriveAsADrive-${{ github.ref_name }}-win-x64.zip"
          (Get-FileHash $zip -Algorithm SHA256).Hash | Out-File "$zip.sha256" -Encoding ascii -NoNewline
          $setup = "OneDriveAsADrive-Setup-${{ github.ref_name }}.exe"
          (Get-FileHash $setup -Algorithm SHA256).Hash | Out-File "$setup.sha256" -Encoding ascii -NoNewline

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: OneDriveAsADrive ${{ github.ref_name }}
          body: |
            ## Install

            **Easiest:** download and run `OneDriveAsADrive-Setup-${{ github.ref_name }}.exe` - it configures Windows WebDAV, registers the background service, and maps your drives.

            **One-liner (PowerShell as Administrator):**

            ```
            iwr https://github.com/${{ github.repository }}/releases/latest/download/install.ps1 -UseBasicParsing | iex
            ```

            The installer verifies the download against the published SHA256 before running it.

            Or download the zip, extract, and run `OneDriveAsADrive.exe`.

            **Requirements:** Windows 10/11, OneDrive (personal or work/school) signed in on the machine.

            > Verify manually: `(Get-FileHash OneDriveAsADrive-${{ github.ref_name }}-win-x64.zip -Algorithm SHA256).Hash` should match the `.sha256` asset.
          files: |
            OneDriveAsADrive-Setup-${{ github.ref_name }}.exe
            OneDriveAsADrive-Setup-${{ github.ref_name }}.exe.sha256
            OneDriveAsADrive-${{ github.ref_name }}-win-x64.zip
            OneDriveAsADrive-${{ github.ref_name }}-win-x64.zip.sha256
            install.ps1
          draft: false
          prerelease: false

      # Publish a copy of the npm package to GitHub Packages so the repo's "Packages"
      # sidebar has something to show off. GitHub insists on an owner-scoped name, so we
      # wear the @avatorsinc/ costume just for this publish - the real unscoped
      # "onedriveasadrive" on npmjs.com is the one people npx. Same guy, different outfit.
      # Like Peter in the chicken suit.
      - name: Setup Node (GitHub Packages registry)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com

      - name: Publish npm package to GitHub Packages
        working-directory: npm
        run: |
          npm pkg set name=@avatorsinc/onedriveasadrive
          # Version rides the git tag, so re-tagging can never collide with a version
          # that's already up there. package.json's own version is for npmjs publishes.
          $version = "${{ github.ref_name }}".TrimStart("v")
          npm pkg set version=$version
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
